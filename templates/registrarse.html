<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse</title>
    <link rel="stylesheet" href="../css/inicio_sesion.css">
</head>
<body>
    <header>
        <h1 class="titulo">Registrarse</h1>
    </header>
    <div class="contenedorFormulario">
        <form id="form_registro" class="contenedorFormulario__formulario">
            <div class="formulario__texto">
                <label for="nombre">Nombre de Usuario</label>
                <input type="text" name="nombre" id="nombre" placeholder="Ej: Juan Pérez">
            </div>
            
            <div class="formulario__texto">
                <label for="correo">Correo electrónico</label>
                <input type="email" name="correo" id="correo" placeholder="correo@ejemplo.com">
            </div>
            
            <div class="formulario__texto password-field">
                <label for="contrasenia">Contraseña</label>
                <input type="password" name="contrasenia" id="contrasenia" placeholder="Ingrese su contraseña">
                <button type="button" class="toggle-pass" data-target="contrasenia" aria-label="Mostrar contraseña">Mostrar</button>

                <!-- medidor: track + fill, y etiqueta debajo -->
                <div class="password-strength" aria-hidden="true">
                    <div class="password-strength__fill" id="password_strength_fill"></div>
                </div>
                <div class="password-strength-label" id="password_strength_label" aria-hidden="true"></div>
            </div>
            <div class="formulario__texto password-field">
                <label for="conf_contrasenia">Confirmar contraseña</label>
                <input type="password" name="conf_contrasenia" id="conf_contrasenia" placeholder="Vuelva a ingresar su contraseña">
                <button type="button" class="toggle-pass" data-target="conf_contrasenia" aria-label="Mostrar contraseña">Mostrar</button>
            </div>
            
            <div class="checkbox-group">
                <input type="checkbox" id="terminos">
                <label for="terminos">Acepto los términos y condiciones</label>
            </div>
            
            <div class="checkbox-group">
                <input type="checkbox" id="correos_recibidos">
                <label for="correos_recibidos">Acepto recibir correos sobre información nueva publicada</label>
            </div>
            
            <div id="contenedor_error"></div>

            <div class="button-group">
                <button id="btn_registrar" type="submit">Registrarse</button>
                <button type="reset">Cancelar</button>
            </div>
        </form>
    </div>
    <div class="contendorAdicional">
        <div>¿Ya tienes una cuenta? <a href="inicio_sesion.html">Iniciar Sesion</a></div>
    </div>
    <a class="botonVolver" href="../index.html">Volver menu principal</a>
    <script src="../javascript/registrarse.js"></script>
</body>
</html>
